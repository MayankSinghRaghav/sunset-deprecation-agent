[project]
name = "sunset"
version = "0.1.0"
description = "Assembles the case for deprecating a software feature. A human signs the death warrant."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.7",
    "jinja2>=3.1",
    "numpy>=2.0",
    "typer>=0.15",
    "structlog>=24.4",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "google-genai>=0.8",
]

[project.optional-dependencies]
# Documented path for environments where huggingface.co is reachable.
# Deliberately NOT installed here: this environment's egress policy blocks HF.
local-embeddings = ["sentence-transformers>=3.3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sunset"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
timeout = 300
markers = [
    "requires_db: test needs a running Postgres cluster (make db-up)",
    "gate: phase gate assertion — these are the numbers the README quotes",
]
filterwarnings = [
    # pgvector's `vector` type is unknown to SQLAlchemy reflection; we do not map
    # it in the ORM (retrieval.py reads it directly), so the warning is expected.
    "ignore:Did not recognize type 'vector':Warning",
]

[tool.ruff]
line-length = 100
src = ["src", "datagen", "eval"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# These modules are mostly authored data literals (feature descriptions, ticket
# and deal-note templates, contract clause prose). Wrapping them hurts more than
# it helps, so line-length is not enforced there.
"datagen/world.py" = ["E501"]
"datagen/generate.py" = ["E501"]
